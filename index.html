<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H@H Version Info</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6e6e73;--card:#f5f5f7;--line:#d2d2d7;--acc:#0a63c9}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#f2f2f4;--mut:#9a9aa1;--card:#232326;--line:#3a3a3f;--acc:#6cb2ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.4rem;margin:0 0 4px}.mut{color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0}
.card{background:var(--card);border-radius:10px;padding:12px 16px}
.card b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
a{color:var(--acc)}
code{font:.9em ui-monospace,monospace;background:var(--card);padding:1px 5px;border-radius:4px}
table{border-collapse:collapse;width:100%}td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
mark{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.8rem}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer}
pre{white-space:pre-wrap;margin:8px 0 0;font:inherit;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>H@H Version Info</h1>
<p class="mut" id="meta">Loading…</p>
<div class="grid" id="versions"></div>
<p id="link"></p>
<h2>Release notes</h2><div id="releases"></div>
<h2>Version pointer changes</h2><ul id="history"></ul>
<h2>API endpoints</h2>
<p class="mut">Static JSON, refreshed daily, CORS enabled (<code>Access-Control-Allow-Origin: *</code>).</p>
<table id="api"></table>
</main>
<script>
const $ = id => document.getElementById(id), esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
Promise.all(['info', 'latest', 'releases', 'history'].map(n => fetch(`api/${n}.json`).then(r => r.json()))).then(([info, latest, releases, hist]) => {
  $('meta').innerHTML = `Last changed ${info.updated_at.replace('T', ' ').replace('Z', ' UTC')} · checked daily · <a href="${info.topic_url}">source thread</a>`;
  const names = {most_recent: 'Most recent', minimum_recommended: 'Minimum recommended', minimum_supported: 'Minimum supported'};
  $('versions').innerHTML = Object.entries(info.versions).map(([k, v]) => `<div class="card">${names[k]}<b>${v}</b></div>`).join('');
  $('link').innerHTML = `Official download location: <a href="${latest.download_link}">${esc(latest.download_link)}</a>`;
  $('releases').innerHTML = releases.map((r, i) =>
    `<details${i ? '' : ' open'}><summary><b>${r.version}</b> · ${r.date}${(r.tags||[]).map(t => ` <mark>${esc(t)}</mark>`).join('')}</summary><pre>${esc(r.notes)}</pre></details>`).join('');
  $('history').innerHTML = Object.keys(hist).sort().reverse().map(t => { const v = hist[t];
    return `<li>${t.replace('T', ' ').replace('Z', ' UTC')}: most recent ${v.most_recent} / recommended ${v.minimum_recommended} / supported ${v.minimum_supported}</li>`; }).join('');
  const base = new URL('api/', location.href).href;
  const eps = [['latest.json', 'Most recent release (version, date, tags, notes) with its download link'],
    ['releases.json', 'All known releases, newest first; kept even after they disappear from the thread'],
    ['history.json', 'Changes to the version pointers, keyed by UTC time'],
    ['info.json', 'Version pointers, last update time (UTC) and source thread URL']];
  $('api').innerHTML = eps.map(([f, t]) => `<tr><td><a href="${base}${f}"><code>GET ${base}${f}</code></a></td><td>${t}</td></tr>`).join('');
}).catch(e => { $('meta').textContent = 'No data yet or failed to load: ' + e.message; });
</script>
</body>
</html>
